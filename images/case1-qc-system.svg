<svg viewBox="0 0 1600 1200" width="100%" height="100%" xmlns="http://www.w3.org/2000/svg" style="background:#070B19; border-radius:16px; font-family:-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;">
  <defs>
    <!-- Gradients -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a1128"/>
      <stop offset="100%" stop-color="#030712"/>
    </linearGradient>
    
    <linearGradient id="attGlobe" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00A8E8"/>
      <stop offset="100%" stop-color="#003366"/>
    </linearGradient>

    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#121C3B" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#0B132B" stop-opacity="0.9"/>
    </linearGradient>

    <linearGradient id="accentGlow" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00A8E8"/>
      <stop offset="100%" stop-color="#00C8FF"/>
    </linearGradient>

    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="12" stdDeviation="18" flood-color="#000000" flood-opacity="0.6"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="1600" height="1200" fill="url(#bgGrad)" rx="16"/>
  <circle cx="1400" cy="200" r="450" fill="#00A8E8" opacity="0.05" filter="blur(60px)"/>
  <circle cx="200" cy="950" r="400" fill="#003366" opacity="0.18" filter="blur(60px)"/>

  <!-- Top UI Header Bar -->
  <rect x="50" y="45" width="1500" height="70" rx="12" fill="#121C3B" stroke="#1F2D5A" stroke-width="2"/>
  <circle cx="85" cy="80" r="9" fill="#FF5F56"/>
  <circle cx="115" cy="80" r="9" fill="#FFBD2E"/>
  <circle cx="145" cy="80" r="9" fill="#27C93F"/>
  <text x="185" y="87" fill="#8E9BB0" font-size="20" font-weight="500">Critical Mass x AT&amp;T Design System Governance &amp; High-Volume QC Framework</text>
  <rect x="1350" y="58" width="180" height="44" rx="22" fill="#00A8E8" opacity="0.18"/>
  <text x="1440" y="86" fill="#00A8E8" font-size="18" font-weight="700" text-anchor="middle">QC PASSED ✓</text>

  <!-- LEFT COLUMN: Programmatic Ad Campaign Mockups -->
  <g filter="url(#shadow)">
    <!-- Main 300x250 Medium Rectangle Display Banner Mockup -->
    <rect x="50" y="150" width="540" height="520" rx="14" fill="#FFFFFF"/>
    <!-- Banner Header Blue Bar -->
    <path d="M 50 164 A 14 14 0 0 1 64 150 L 576 150 A 14 14 0 0 1 590 164 L 590 350 L 50 350 Z" fill="#003366"/>
    
    <!-- AT&T Globe Icon -->
    <circle cx="120" cy="230" r="32" fill="url(#attGlobe)"/>
    <path d="M 94 222 Q 120 210 146 222 M 90 230 Q 120 216 150 230 M 94 238 Q 120 226 146 238" stroke="#FFFFFF" stroke-width="3" fill="none"/>
    
    <text x="120" y="295" fill="#FFFFFF" font-size="30" font-weight="700">Connecting your world.</text>
    <text x="120" y="325" fill="#80C3FF" font-size="20">Fiber 5G Unlimited Gig Speed</text>
    
    <!-- Banner Body Content -->
    <text x="90" y="415" fill="#0C2340" font-size="36" font-weight="800">AT&amp;T Fiber®</text>
    <text x="90" y="455" fill="#4A5568" font-size="22">Speeds up to 5 Gig. No price increase at 1 yr.</text>
    
    <!-- CTA Button -->
    <rect x="90" y="495" width="240" height="60" rx="30" fill="url(#accentGlow)"/>
    <text x="210" y="533" fill="#002244" font-size="20" font-weight="700" text-anchor="middle">Check Availability</text>

    <!-- Vertical Banner Mockup -->
    <rect x="620" y="150" width="380" height="520" rx="14" fill="#0C2340"/>
    <rect x="650" y="180" width="320" height="240" rx="10" fill="#122C4F"/>
    <circle cx="810" cy="270" r="45" fill="url(#attGlobe)"/>
    <text x="810" y="350" fill="#FFFFFF" font-size="24" font-weight="700" text-anchor="middle">5G Network</text>
    <text x="660" y="465" fill="#FFFFFF" font-size="26" font-weight="700">Reliability meets speed.</text>
    <text x="660" y="495" fill="#80C3FF" font-size="18">Coverage across America.</text>
    <rect x="660" y="525" width="300" height="54" rx="27" fill="#00A8E8"/>
    <text x="810" y="559" fill="#FFFFFF" font-size="19" font-weight="700" text-anchor="middle">Learn More</text>

    <!-- Leaderboard Banner (Horizontal 728x90 concept) -->
    <rect x="50" y="700" width="950" height="180" rx="14" fill="#003366" stroke="#00A8E8" stroke-width="2"/>
    <circle cx="120" cy="790" r="32" fill="url(#attGlobe)"/>
    <text x="180" y="775" fill="#FFFFFF" font-size="28" font-weight="700">Switch to AT&amp;T Wireless &amp; Save</text>
    <text x="180" y="810" fill="#80C3FF" font-size="20">Get up to $1000 off eligible trade-in smartphones.</text>
    <rect x="730" y="760" width="230" height="60" rx="30" fill="#00A8E8"/>
    <text x="845" y="797" fill="#FFFFFF" font-size="20" font-weight="700" text-anchor="middle">Shop Deals</text>
  </g>

  <!-- RIGHT COLUMN: Governance & Component System Panel -->
  <g filter="url(#shadow)">
    <rect x="1030" y="150" width="520" height="960" rx="16" fill="url(#cardGrad)" stroke="#1F2D5A" stroke-width="2"/>
    
    <!-- Panel Header -->
    <text x="1070" y="210" fill="#FFFFFF" font-size="26" font-weight="700">AT&amp;T Design Tokens</text>
    <text x="1070" y="242" fill="#6B7A99" font-size="18">Automated Quality Assurance Rules</text>
    <line x1="1070" y1="270" x2="1510" y2="270" stroke="#1F2D5A" stroke-width="2"/>

    <!-- Color Palette Tokens -->
    <text x="1070" y="310" fill="#8E9BB0" font-size="16" font-weight="700">PRIMARY COLOR PALETTE</text>
    
    <circle cx="1095" cy="355" r="22" fill="#003366"/>
    <text x="1135" y="350" fill="#FFFFFF" font-size="20" font-weight="600">AT&amp;T Dark Blue</text>
    <text x="1135" y="375" fill="#6B7A99" font-size="16">#003366 · Passed 7.1:1 AAA</text>

    <circle cx="1095" cy="430" r="22" fill="#00A8E8"/>
    <text x="1135" y="425" fill="#FFFFFF" font-size="20" font-weight="600">AT&amp;T Globe Blue</text>
    <text x="1135" y="450" fill="#6B7A99" font-size="16">#00A8E8 · Brand Accent</text>

    <!-- Typography Tokens -->
    <line x1="1070" y1="485" x2="1510" y2="485" stroke="#1F2D5A" stroke-width="2"/>
    <text x="1070" y="525" fill="#8E9BB0" font-size="16" font-weight="700">TYPOGRAPHY HIERARCHY</text>
    <text x="1070" y="565" fill="#FFFFFF" font-size="28" font-weight="700">ClearviewATT Bold</text>
    <text x="1070" y="605" fill="#CBD5E1" font-size="22">ClearviewATT Regular (Body Text)</text>

    <!-- Quality Control Checklist Items -->
    <line x1="1070" y1="645" x2="1510" y2="645" stroke="#1F2D5A" stroke-width="2"/>
    <text x="1070" y="685" fill="#8E9BB0" font-size="16" font-weight="700">AUTOMATED QC CHECKS</text>

    <rect x="1070" y="715" width="440" height="54" rx="10" fill="#0D1936" stroke="#1F2D5A" stroke-width="1.5"/>
    <circle cx="1100" cy="742" r="9" fill="#27C93F"/>
    <text x="1125" y="749" fill="#D1D5DB" font-size="17">Logo 1x Clear Space Verified</text>

    <rect x="1070" y="785" width="440" height="54" rx="10" fill="#0D1936" stroke="#1F2D5A" stroke-width="1.5"/>
    <circle cx="1100" cy="812" r="9" fill="#27C93F"/>
    <text x="1125" y="819" fill="#D1D5DB" font-size="17">CTA Contrast Ratio &gt; 4.5:1</text>

    <rect x="1070" y="855" width="440" height="54" rx="10" fill="#0D1936" stroke="#1F2D5A" stroke-width="1.5"/>
    <circle cx="1100" cy="882" r="9" fill="#27C93F"/>
    <text x="1125" y="889" fill="#D1D5DB" font-size="17">Export File Size &lt; 150KB (HTML5)</text>

    <rect x="1070" y="925" width="440" height="54" rx="10" fill="#0D1936" stroke="#1F2D5A" stroke-width="1.5"/>
    <circle cx="1100" cy="952" r="9" fill="#27C93F"/>
    <text x="1125" y="959" fill="#D1D5DB" font-size="17">Multi-device Aspect Ratios Approved</text>

    <rect x="1070" y="995" width="440" height="54" rx="10" fill="#0D1936" stroke="#1F2D5A" stroke-width="1.5"/>
    <circle cx="1100" cy="1022" r="9" fill="#27C93F"/>
    <text x="1125" y="1029" fill="#D1D5DB" font-size="17">Motion &amp; Video Keyframe Sync Validated</text>
  </g>

  <!-- Bottom Stats Footer -->
  <rect x="50" y="910" width="950" height="200" rx="16" fill="url(#cardGrad)" stroke="#1F2D5A" stroke-width="2"/>
  
  <text x="100" y="975" fill="#00A8E8" font-size="42" font-weight="800">100%</text>
  <text x="100" y="1015" fill="#8E9BB0" font-size="20">Brand Compliance</text>

  <text x="380" y="975" fill="#00A8E8" font-size="42" font-weight="800">15+ Member</text>
  <text x="380" y="1015" fill="#8E9BB0" font-size="20">Creative &amp; QC Team Led</text>

  <text x="700" y="975" fill="#00A8E8" font-size="42" font-weight="800">Omnichannel</text>
  <text x="700" y="1015" fill="#8E9BB0" font-size="20">Web, Video &amp; Programmatic</text>
</svg>
