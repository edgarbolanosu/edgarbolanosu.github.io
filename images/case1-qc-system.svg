<svg viewBox="0 0 900 560" width="100%" height="100%" xmlns="http://www.w3.org/2000/svg" style="background:#070B19; border-radius:12px; font-family:-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;">
  <defs>
    <!-- Gradients -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a1128"/>
      <stop offset="100%" stop-color="#030712"/>
    </linearGradient>
    
    <linearGradient id="attGlobe" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00A8E8"/>
      <stop offset="100%" stop-color="#003366"/>
    </linearGradient>

    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#121C3B" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#0B132B" stop-opacity="0.9"/>
    </linearGradient>

    <linearGradient id="accentGlow" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00A8E8"/>
      <stop offset="100%" stop-color="#00C8FF"/>
    </linearGradient>

    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#000000" flood-opacity="0.5"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="900" height="560" fill="url(#bgGrad)" rx="12"/>
  <circle cx="800" cy="100" r="250" fill="#00A8E8" opacity="0.05" filter="blur(40px)"/>
  <circle cx="100" cy="450" r="200" fill="#003366" opacity="0.15" filter="blur(40px)"/>

  <!-- Top UI Header Bar -->
  <rect x="30" y="25" width="840" height="40" rx="8" fill="#121C3B" stroke="#1F2D5A" stroke-width="1"/>
  <circle cx="50" cy="45" r="5" fill="#FF5F56"/>
  <circle cx="66" cy="45" r="5" fill="#FFBD2E"/>
  <circle cx="82" cy="45" r="5" fill="#27C93F"/>
  <text x="105" y="49" fill="#8E9BB0" font-size="11" font-weight="500">Critical Mass x AT&amp;T Design System Governance &amp; High-Volume QC Framework</text>
  <rect x="750" y="33" width="100" height="24" rx="12" fill="#00A8E8" opacity="0.15"/>
  <text x="800" y="49" fill="#00A8E8" font-size="11" font-weight="600" text-anchor="middle">QC PASSED ✓</text>

  <!-- CANVAS LEFT: Display Ad Campaign Suite Mockup (Programmatic Banners) -->
  <g filter="url(#shadow)">
    <!-- Main 300x250 Banner Mockup -->
    <rect x="30" y="85" width="300" height="250" rx="8" fill="#FFFFFF"/>
    <!-- Banner Header Blue Bar -->
    <path d="M 30 93 A 8 8 0 0 1 38 85 L 322 85 A 8 8 0 0 1 330 93 L 330 180 L 30 180 Z" fill="#003366"/>
    <!-- AT&T Globe Placeholder (SVG Icon) -->
    <circle cx="65" cy="120" r="16" fill="url(#attGlobe)"/>
    <path d="M 52 116 Q 65 110 78 116 M 50 120 Q 65 113 80 120 M 52 124 Q 65 118 78 124" stroke="#FFFFFF" stroke-width="1.5" fill="none"/>
    
    <text x="65" y="152" fill="#FFFFFF" font-size="16" font-weight="700">Connecting your world.</text>
    <text x="65" y="167" fill="#80C3FF" font-size="11">Fiber 5G Unlimited Gig Speed</text>
    
    <!-- Banner Body -->
    <text x="50" y="210" fill="#0C2340" font-size="18" font-weight="800">AT&amp;T Fiber®</text>
    <text x="50" y="228" fill="#4A5568" font-size="11">Speeds up to 5 Gig. No price increase at 1 yr.</text>
    
    <!-- CTA Button -->
    <rect x="50" y="248" width="120" height="32" rx="16" fill="url(#accentGlow)"/>
    <text x="110" y="269" fill="#002244" font-size="11" font-weight="700" text-anchor="middle">Check Availability</text>

    <!-- Small 728x90 Leaderboard Preview -->
    <rect x="30" y="350" width="530" height="80" rx="8" fill="#003366" stroke="#00A8E8" stroke-width="1"/>
    <circle cx="65" cy="390" r="14" fill="url(#attGlobe)"/>
    <text x="95" y="388" fill="#FFFFFF" font-size="14" font-weight="700">Switch to AT&amp;T Wireless &amp; Save</text>
    <text x="95" y="403" fill="#80C3FF" font-size="10">Get up to $1000 off eligible trade-in smartphones.</text>
    <rect x="420" y="375" width="110" height="30" rx="15" fill="#00A8E8"/>
    <text x="475" y="394" fill="#FFFFFF" font-size="11" font-weight="700" text-anchor="middle">Shop Deals</text>

    <!-- Mobile Vertical Banner 160x600 Scaled -->
    <rect x="345" y="85" width="215" height="250" rx="8" fill="#0C2340"/>
    <rect x="360" y="100" width="185" height="120" rx="6" fill="#122C4F"/>
    <circle cx="452" cy="145" r="22" fill="url(#attGlobe)"/>
    <text x="452" y="182" fill="#FFFFFF" font-size="12" font-weight="700" text-anchor="middle">5G Network</text>
    <text x="365" y="242" fill="#FFFFFF" font-size="13" font-weight="700">Reliability meets speed.</text>
    <rect x="365" y="255" width="175" height="26" rx="13" fill="#00A8E8"/>
    <text x="452" y="272" fill="#FFFFFF" font-size="10" font-weight="700" text-anchor="middle">Learn More</text>
  </g>

  <!-- CANVAS RIGHT: Governance & Component System Panel -->
  <g filter="url(#shadow)">
    <rect x="580" y="85" width="290" height="445" rx="10" fill="url(#cardGrad)" stroke="#1F2D5A" stroke-width="1"/>
    
    <!-- Panel Header -->
    <text x="600" y="115" fill="#FFFFFF" font-size="14" font-weight="700">AT&amp;T Design Tokens</text>
    <text x="600" y="132" fill="#6B7A99" font-size="11">Automated Quality Assurance Rules</text>
    <line x1="600" y1="145" x2="850" y2="145" stroke="#1F2D5A" stroke-width="1"/>

    <!-- Color Palette Tokens -->
    <text x="600" y="168" fill="#8E9BB0" font-size="10" font-weight="600">PRIMARY COLOR PALETTE</text>
    
    <circle cx="612" cy="190" r="12" fill="#003366"/>
    <text x="632" y="188" fill="#FFFFFF" font-size="11" font-weight="600">AT&amp;T Dark Blue</text>
    <text x="632" y="200" fill="#6B7A99" font-size="9">#003366 · Passed 7.1:1 AAA</text>

    <circle cx="612" cy="225" r="12" fill="#00A8E8"/>
    <text x="632" y="223" fill="#FFFFFF" font-size="11" font-weight="600">AT&amp;T Globe Blue</text>
    <text x="632" y="235" fill="#6B7A99" font-size="9">#00A8E8 · Brand Accent</text>

    <!-- Typography Tokens -->
    <line x1="600" y1="252" x2="850" y2="252" stroke="#1F2D5A" stroke-width="1"/>
    <text x="600" y="272" fill="#8E9BB0" font-size="10" font-weight="600">TYPOGRAPHY HIERARCHY</text>
    <text x="600" y="295" fill="#FFFFFF" font-size="16" font-weight="700">ClearviewATT Bold</text>
    <text x="600" y="315" fill="#CBD5E1" font-size="12">ClearviewATT Regular (Body Text)</text>

    <!-- Quality Control Checklist Items -->
    <line x1="600" y1="335" x2="850" y2="335" stroke="#1F2D5A" stroke-width="1"/>
    <text x="600" y="355" fill="#8E9BB0" font-size="10" font-weight="600">AUTOMATED QC CHECKS</text>

    <rect x="600" y="370" width="250" height="28" rx="6" fill="#0D1936" stroke="#1F2D5A" stroke-width="1"/>
    <circle cx="615" cy="384" r="5" fill="#27C93F"/>
    <text x="628" y="388" fill="#D1D5DB" font-size="10">Logo 1x Clear Space Verified</text>

    <rect x="600" y="405" width="250" height="28" rx="6" fill="#0D1936" stroke="#1F2D5A" stroke-width="1"/>
    <circle cx="615" cy="419" r="5" fill="#27C93F"/>
    <text x="628" y="423" fill="#D1D5DB" font-size="10">CTA Contrast Ratio &gt; 4.5:1</text>

    <rect x="600" y="440" width="250" height="28" rx="6" fill="#0D1936" stroke="#1F2D5A" stroke-width="1"/>
    <circle cx="615" cy="454" r="5" fill="#27C93F"/>
    <text x="628" y="458" fill="#D1D5DB" font-size="10">Export File Size &lt; 150KB (HTML5)</text>

    <rect x="600" y="475" width="250" height="28" rx="6" fill="#0D1936" stroke="#1F2D5A" stroke-width="1"/>
    <circle cx="615" cy="489" r="5" fill="#27C93F"/>
    <text x="628" y="493" fill="#D1D5DB" font-size="10">Multi-device Aspect Ratios Approved</text>
  </g>

  <!-- Bottom Stats Footer -->
  <rect x="30" y="450" width="530" height="80" rx="8" fill="url(#cardGrad)" stroke="#1F2D5A" stroke-width="1"/>
  <text x="60" y="480" fill="#00A8E8" font-size="20" font-weight="800">100%</text>
  <text x="60" y="498" fill="#8E9BB0" font-size="11">Brand Compliance</text>

  <text x="210" y="480" fill="#00A8E8" font-size="20" font-weight="800">15+ Member</text>
  <text x="210" y="498" fill="#8E9BB0" font-size="11">Creative &amp; QC Team Led</text>

  <text x="390" y="480" fill="#00A8E8" font-size="20" font-weight="800">Omnichannel</text>
  <text x="390" y="498" fill="#8E9BB0" font-size="11">Web, Video &amp; Programmatic</text>
</svg>
